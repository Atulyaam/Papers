# ── D15 Timeouts (seconds) ────────────────────────────────────────────────────
# Safety factor: 2x on Sprint 9 recorded component runtimes.
# Component baselines from Sprint 9 runtime records.
timeouts:
  safety_factor: 2.0
  # A0: RF fresh training on full TRAIN. Baseline: rf_refit=12.5s. 2x → 30s (round up generous)
  a0_training_sec: 60
  # Base cache per seed (all 4 models × 5 folds OOF + full-TRAIN dev_test).
  # Baseline: stacking OOF per seed ~680s. 2x → 1360s.
  cache_per_seed_sec: 1400
  # Meta-learner fit (LR). Baseline: 0.26s. 2x → 1s. Use generous 30s.
  meta_learner_sec: 30
  # A1b combination (pure inference). Generous: 30s.
  a1b_combination_sec: 30
  # A6: AE inference + fusion. Generous: 60s.
  a6_inference_sec: 60
  # Full config evaluation (A1-A6 per seed after cache exists). 120s generous.
  per_config_seed_sec: 120

# ── Environment (D11) ────────────────────────────────────────────────────────
# Authoritative environment for Sprint 10: sklearn=1.9.0 (matches EXP_OOF_STACK_V1).
# The EXP_H123_V1 runtime_report sklearn=1.5.0 field is a recording discrepancy.
d11_authoritative_env:
  sklearn: "1.9.0"
  numpy: "2.4.6"
  torch: "2.7.1+cu118"
  pandas: "3.0.5"

