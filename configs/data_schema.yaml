# =============================================================================
# configs/data_schema.yaml
# HAND-AUTHORED EXPECTED CONTRACT for the UNSW-NB15 IDS project.
#
# This file defines what the preprocessing pipeline EXPECTS to find.
# It is distinct from data/audit/dataset_schema.json which records what
# the dataset ACTUALLY contains.
#
# Roles:
#   configs/data_schema.yaml        — expected contract (this file)
#   data/audit/dataset_schema.json  — observed schema (generated by audit)
#
# Fields marked "audit-TBD" will be updated after Sprint 1 audit.
# The schema_validator.py compares observed against this contract.
#
# IMPORTANT: This file does NOT hard-code NSL-KDD values (41 features, etc.).
# All numeric values must come from the actual UNSW-NB15 audit.
# =============================================================================

schema_version: "1.0-sprint1"
dataset: UNSW-NB15
source_document: "Official UNSW-NB15 pre-split CSV layout (Scenario B)"

# ---------------------------------------------------------------------------
# Target column
# ---------------------------------------------------------------------------
target:
  column: label
  allowed_values: [0, 1]
  semantics:
    0: normal
    1: attack
  note: "Expected binary values. Actual values verified in Sprint 1 audit."

# ---------------------------------------------------------------------------
# Attack category column
# ---------------------------------------------------------------------------
attack_category:
  column: attack_cat
  canonicalization_module: "src/preprocessing/attack_cat_canonicalization.py"
  note: >
    Raw strings must be audited before canonicalization.
    The CANONICAL_MAP in the canonicalization module is populated from
    observed values only — no speculative mappings.

# ---------------------------------------------------------------------------
# Known categorical columns (to be confirmed by audit)
# ---------------------------------------------------------------------------
candidate_categorical_columns:
  - proto
  - service
  - state
note: "Actual categorical status confirmed after Sprint 1 column-type audit."

# ---------------------------------------------------------------------------
# Candidate identifier / time-like columns
# (Sprint 1 records observations; Sprint 2 decides final treatment)
# ---------------------------------------------------------------------------
candidate_exclude_columns:
  - id
  - srcip
  - dstip
  - sport
  - dsport
  - Stime
  - Ltime
note: >
  These columns may be identifiers or time fields. Sprint 1 audits their
  observed dtype, unique count, and sample values. Sprint 2 decides
  whether each is excluded, coerced, or retained as a feature.

# ---------------------------------------------------------------------------
# Missing-value policy (TBD — decided after audit)
# ---------------------------------------------------------------------------
missing_value_policy: "audit-TBD"

# ---------------------------------------------------------------------------
# Non-finite value policy (TBD — decided after audit)
# ---------------------------------------------------------------------------
non_finite_policy: "audit-TBD"

# ---------------------------------------------------------------------------
# sport / dsport treatment
# (TBD — these may be numeric or contain string anomaly values like '-')
# ---------------------------------------------------------------------------
sport_dsport_treatment: "audit-TBD"

# ---------------------------------------------------------------------------
# Expected record counts (from official UNSW-NB15 documentation)
# ---------------------------------------------------------------------------
expected_row_counts:
  train: 175341
  test: 82332
  note: "From official UNSW-NB15 documentation. Actual counts verified by audit."

# ---------------------------------------------------------------------------
# Expected feature count
# (NOT hard-coded — derived from actual audit)
# ---------------------------------------------------------------------------
expected_raw_feature_count: "audit-TBD"
expected_mi_selected_count: "determined-by-sprint4"
