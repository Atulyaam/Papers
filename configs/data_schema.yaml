# =============================================================================
# configs/data_schema.yaml
# HAND-AUTHORED EXPECTED CONTRACT for the UNSW-NB15 IDS project.
#
# This file defines what the preprocessing pipeline EXPECTS to find.
# It is distinct from data/audit/dataset_schema.json which records what
# the dataset ACTUALLY contains.
#
# Roles:
#   configs/data_schema.yaml        — expected contract (this file)
#   data/audit/dataset_schema.json  — observed schema (generated by audit)
#
# Fields marked "audit-TBD" will be updated after Sprint 2 feature analysis.
# The schema_validator.py compares observed against this contract.
#
# IMPORTANT: This file does NOT hard-code NSL-KDD values (41 features, etc.).
# Values are grounded in the UNSW-NB15 audit performed in Sprint 1.
# =============================================================================

schema_version: "1.0-sprint1"
dataset: UNSW-NB15
source_document: "Official UNSW-NB15 pre-split CSV layout (Scenario B)"

# ---------------------------------------------------------------------------
# Target column
# ---------------------------------------------------------------------------
target:
  column: label
  allowed_values: [0, 1]
  semantics:
    0: normal
    1: attack
  note: "Verified by Sprint 1 label audit. No unexpected values found."

# ---------------------------------------------------------------------------
# Attack category column
# ---------------------------------------------------------------------------
attack_category:
  column: attack_cat
  canonicalization_module: "src/preprocessing/attack_cat_canonicalization.py"
  note: >
    Raw strings audited in Sprint 1. All 10 values were already canonical
    (no whitespace, correct capitalisation). No lossy merges applied.

# ---------------------------------------------------------------------------
# Known categorical columns (confirmed by Sprint 1 audit)
# ---------------------------------------------------------------------------
candidate_categorical_columns:
  - proto
  - service
  - state
note: "Sprint 1 audit confirms these columns are object/string dtype."

# ---------------------------------------------------------------------------
# Candidate identifier / potential-exclude columns
# SPRINT 1 AUDIT OBSERVATION:
#   The official pre-split CSVs (UNSW_NB15_training-set.csv /
#   UNSW_NB15_testing-set.csv) do NOT contain raw IP address fields
#   (srcip, dstip) or raw port fields (sport, dsport) or Unix timestamp
#   fields (Stime, Ltime).
#   These columns exist only in the four large raw shard CSVs
#   (UNSW-NB15_1.csv … UNSW-NB15_4.csv), which are NOT used in this project.
#   The 'id' column IS present in the pre-split files and is a candidate
#   for exclusion as a row identifier.
# Sprint 2 decides final modeling treatment.
# ---------------------------------------------------------------------------
candidate_exclude_columns:
  - id
columns_absent_from_presplit:
  - srcip
  - dstip
  - sport
  - dsport
  - Stime
  - Ltime
columns_absent_note: >
  The above columns are not present in the pre-split CSV files used by this
  project. They were documented as project_config.yaml candidates originally
  but observed to be absent. This is expected and is NOT a schema violation.

# ---------------------------------------------------------------------------
# Missing-value policy (TBD — decided after audit + Sprint 2)
# Sprint 1 OBSERVATION: Zero null values in both training and test sets.
# ---------------------------------------------------------------------------
missing_value_policy: "sprint1-nulls-zero"

# ---------------------------------------------------------------------------
# Non-finite value policy (TBD — decided after Sprint 2 feature analysis)
# ---------------------------------------------------------------------------
non_finite_policy: "audit-TBD"

# ---------------------------------------------------------------------------
# Expected record counts (verified by Sprint 1 audit)
# ---------------------------------------------------------------------------
expected_row_counts:
  train: 175341
  test: 82332
  note: "Official UNSW-NB15 documentation counts. Verified by Sprint 1 audit."

# ---------------------------------------------------------------------------
# Feature count (from Sprint 1 audit — do NOT hard-code NSL-KDD value of 41)
# ---------------------------------------------------------------------------
expected_raw_column_count: 45
expected_feature_cols: 43
column_count_note: >
  45 total columns observed in Sprint 1 audit.
  Minus label (1) and attack_cat (1) = 43 potential feature columns.
  Final modelling feature set determined after MI analysis in Sprint 4.
expected_mi_selected_count: "determined-by-sprint4"
